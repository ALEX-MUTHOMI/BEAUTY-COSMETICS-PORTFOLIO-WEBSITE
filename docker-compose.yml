networks:
  beauty_isolated_net:
    driver: bridge
    internal: false # Internal is false to allow web/worker outbound integration APIs (e.g. M-Pesa, Stripe) but internal isolation keeps services safe.
    name: beauty_isolated_network

volumes:
  postgres_data:
    driver: local

services:
  # ============================================================================
  # 1. POSTGRES DATABASE SERVICE (Isolated & Secured)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: beauty_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_db}
      POSTGRES_USER: ${POSTGRES_USER:-beauty_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    # Database is only reachable on the Docker bridge network.
    expose:
      - "5432"
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    # Docker Native Healthcheck - Mitigates Container Race Conditions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-beauty_user} -d $${POSTGRES_DB:-beauty_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  # ============================================================================
  # 2. REDIS CACHE & MESSAGING SERVICE (Secured with Passwords)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: beauty_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-beauty_redis_secure_password}
    # Redis is only reachable on the Docker bridge network.
    expose:
      - "6379"
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    # Docker Native Healthcheck
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-beauty_redis_secure_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  # ============================================================================
  # 3. DJANGO DRF WEB APPLICATION SERVICE
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: beauty_web_app:latest
    container_name: beauty_web_app
    # Overriding production run gunicorn with development auto-reload server if needed
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app:rw
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - POETRY_VIRTUALENVS_CREATE=false
      - SECRET_KEY=${SECRET_KEY:-phase1-phase2-prod-verification-key-8f4a2c9e7b6d5a3c1f0e9d8b7a6c5e4f}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
    restart: unless-stopped

  # ============================================================================
  # 4. NUXT 3 SSR FRONTEND SERVICE
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: beauty_nuxt_frontend:latest
    container_name: beauty_nuxt_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - NUXT_PUBLIC_API_BASE_URL=http://web:8000
      - NUXT_PUBLIC_TURNSTILE_SITE_KEY=${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-1x0000000000000000000000000000000AA}
      - NUXT_TURNSTILE_SECRET_KEY=${NUXT_TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    depends_on:
      - web
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    restart: unless-stopped

  # ============================================================================
  # 5. CELERY WORKER FOR BACKGROUND TASKS & SCHEDULES
  # ============================================================================
  worker:
    image: beauty_web_app:latest
    container_name: beauty_celery_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app:rw
    environment:
      - DEBUG=${DEBUG:-False}
      - POETRY_VIRTUALENVS_CREATE=false
      - SECRET_KEY=${SECRET_KEY:-phase1-phase2-prod-verification-key-8f4a2c9e7b6d5a3c1f0e9d8b7a6c5e4f}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q OK"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    restart: unless-stopped
