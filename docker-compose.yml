version: '3.8'

networks:
  beauty_isolated_net:
    driver: bridge
    internal: false # Internal is false to allow web/worker outbound integration APIs (e.g. M-Pesa, Stripe) but internal isolation keeps services safe.
    name: beauty_isolated_network

volumes:
  postgres_data:
    driver: local

services:
  # ============================================================================
  # 1. POSTGRES DATABASE SERVICE (Isolated & Secured)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: beauty_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_db}
      POSTGRES_USER: ${POSTGRES_USER:-beauty_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    # Strict Host Port Binding: Database is NEVER exposed to public host interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    # Docker Native Healthcheck - Mitigates Container Race Conditions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-beauty_user} -d $${POSTGRES_DB:-beauty_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: unless-stopped

  # ============================================================================
  # 2. REDIS CACHE & MESSAGING SERVICE (Secured with Passwords)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: beauty_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-beauty_redis_secure_password}
    # Strict Host Port Binding: Redis is bound strictly to local loopback interface.
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    # Docker Native Healthcheck
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-beauty_redis_secure_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  # ============================================================================
  # 3. DJANGO DRF WEB APPLICATION SERVICE
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty_web_app
    # Overriding production run gunicorn with development auto-reload server if needed
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app:rw
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-secret-key-32-chars-minimum}
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
    restart: unless-stopped

  # ============================================================================
  # 4. CELERY WORKER FOR BACKGROUND TASKS & SCHEDULES
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty_celery_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app:rw
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-development-secret-key-32-chars-minimum}
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    restart: unless-stopped
