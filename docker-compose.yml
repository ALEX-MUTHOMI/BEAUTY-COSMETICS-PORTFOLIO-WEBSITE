networks:
  beauty_isolated_net:
    driver: bridge
    internal: false # Allows web/worker outbound integration APIs while keeping services isolated on the Docker network.
    name: beauty_isolated_network

volumes:
  postgres_data:
    driver: local
  receipt_artifacts:
    driver: local
  pytest_cache:
    driver: local

services:
  # ============================================================================
  # 1. POSTGRES DATABASE SERVICE
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: beauty_postgres_db
    command:
      [
        "postgres",
        "-c",
        "log_min_error_statement=fatal",
        "-c",
        "log_error_verbosity=terse",
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beauty_db}
      POSTGRES_USER: ${POSTGRES_USER:-beauty_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    expose:
      - "5432"
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-beauty_user} -d $${POSTGRES_DB:-beauty_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  # ============================================================================
  # 2. REDIS CACHE / BROKER SERVICE
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: beauty_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-beauty_redis_secure_password}
    expose:
      - "6379"
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-beauty_redis_secure_password}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  # ============================================================================
  # 3. DJANGO DRF WEB APPLICATION SERVICE
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: beauty_web_app:latest
    container_name: beauty_web_app
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application
    volumes:
      - .:/app:rw
      - receipt_artifacts:/app/var/receipt-artifacts:rw
      - pytest_cache:/app/var/pytest-cache:rw
    ports:
      - "8000:8000"
    environment:
      # ------------------------------------------------------------------------
      # Runtime
      # ------------------------------------------------------------------------
      - DEBUG=${DEBUG:-False}
      - POETRY_VIRTUALENVS_CREATE=false
      - PATH=/app/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      - SECRET_KEY=${SECRET_KEY:-phase1-phase2-prod-verification-key-8f4a2c9e7b6d5a3c1f0e9d8b7a6c5e4f}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DISABLE_DJANGO_ADMIN=${DISABLE_DJANGO_ADMIN:-False}
      - DRF_DISABLE_BROWSABLE_API=${DRF_DISABLE_BROWSABLE_API:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PII_HASH_PEPPER=${PII_HASH_PEPPER:-local-test-pii-hash-pepper-change-me}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-local-test-pii-encryption-key-change-me}

      # ------------------------------------------------------------------------
      # Database
      # ------------------------------------------------------------------------
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

      # ------------------------------------------------------------------------
      # Redis / Celery
      # ------------------------------------------------------------------------
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0

      # ------------------------------------------------------------------------
      # Browser / proxy safety
      # ------------------------------------------------------------------------
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}

      # ------------------------------------------------------------------------
      # Default payment provider safety
      # Normal/default tests must remain fake-provider only.
      # Real Daraja tests must remain opt-in through external pytest flags.
      # ------------------------------------------------------------------------
      - CHECKOUT_MPESA_PROVIDER=fake
      - PAYMENT_PROVIDER_MODE=fake

      # ------------------------------------------------------------------------
      # Daraja sandbox / external payment verification
      # Never commit real values. Values come from local .env / shell env only.
      # ------------------------------------------------------------------------
      - DARAJA_ENV=${DARAJA_ENV:-}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY:-}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET:-}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE:-}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY:-}
      - DARAJA_CALLBACK_URL=${DARAJA_CALLBACK_URL:-}
      - DARAJA_ACCOUNT_REFERENCE=${DARAJA_ACCOUNT_REFERENCE:-}
      - DARAJA_TRANSACTION_DESC=${DARAJA_TRANSACTION_DESC:-}
      - DARAJA_TEST_MSISDN=${DARAJA_TEST_MSISDN:-}
      - DARAJA_TEST_AMOUNT=${DARAJA_TEST_AMOUNT:-1}

      # ------------------------------------------------------------------------
      # Real callback verification controls
      # These are the missing settings that must reach Django for tunnel testing.
      # ------------------------------------------------------------------------
      - DARAJA_REQUIRE_CALLBACK=${DARAJA_REQUIRE_CALLBACK:-false}
      - DARAJA_CALLBACK_WAIT_SECONDS=${DARAJA_CALLBACK_WAIT_SECONDS:-0}
      - DARAJA_CALLBACK_POLL_INTERVAL_SECONDS=${DARAJA_CALLBACK_POLL_INTERVAL_SECONDS:-5}
      - DARAJA_SANDBOX_ALLOW_TUNNEL_CALLBACKS=${DARAJA_SANDBOX_ALLOW_TUNNEL_CALLBACKS:-false}
      - DARAJA_SANDBOX_CALLBACK_TUNNEL_DOMAINS=${DARAJA_SANDBOX_CALLBACK_TUNNEL_DOMAINS:-}

      # ------------------------------------------------------------------------
      # Daraja network/client config
      # ------------------------------------------------------------------------
      - DARAJA_BASE_URL=${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}
      - DARAJA_CONNECT_TIMEOUT_SECONDS=${DARAJA_CONNECT_TIMEOUT_SECONDS:-2}
      - DARAJA_READ_TIMEOUT_SECONDS=${DARAJA_READ_TIMEOUT_SECONDS:-5}
      - DARAJA_TOKEN_CACHE_TTL_SECONDS=${DARAJA_TOKEN_CACHE_TTL_SECONDS:-3300}
      - DARAJA_ALLOWED_SANDBOX_IPS=${DARAJA_ALLOWED_SANDBOX_IPS:-}

      # ------------------------------------------------------------------------
      # Transactional email / receipt delivery
      # Default remains fake. Real provider tests are opt-in only.
      # ------------------------------------------------------------------------
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-fake}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-Beauty SaaS <no-reply@example.test>}
      - EMAIL_REPLY_TO_ADDRESS=${EMAIL_REPLY_TO_ADDRESS:-support@example.test}
      - EMAIL_PROVIDER_API_KEY=${EMAIL_PROVIDER_API_KEY:-}
      - EMAIL_PROVIDER_BASE_URL=${EMAIL_PROVIDER_BASE_URL:-}
      - EMAIL_SEND_TIMEOUT_SECONDS=${EMAIL_SEND_TIMEOUT_SECONDS:-5}
      - EMAIL_EXTERNAL_TEST_RECIPIENT=${EMAIL_EXTERNAL_TEST_RECIPIENT:-}
      - RUN_EXTERNAL_EMAIL_TESTS=${RUN_EXTERNAL_EMAIL_TESTS:-false}
      - RECEIPT_PDF_TIMEOUT_SECONDS=${RECEIPT_PDF_TIMEOUT_SECONDS:-5}
      - RECEIPT_PDF_MAX_BYTES=${RECEIPT_PDF_MAX_BYTES:-250000}
      - RECEIPT_PDF_ARTIFACT_DIR=${RECEIPT_PDF_ARTIFACT_DIR:-/app/var/receipt-artifacts}
      - PYTEST_CACHE_DIR=${PYTEST_CACHE_DIR:-/app/var/pytest-cache}
      - EMAIL_NOTIFICATION_MAX_ATTEMPTS=${EMAIL_NOTIFICATION_MAX_ATTEMPTS:-3}
      - EMAIL_DAILY_SOFT_LIMIT=${EMAIL_DAILY_SOFT_LIMIT:-80}
      - EMAIL_DAILY_HARD_LIMIT=${EMAIL_DAILY_HARD_LIMIT:-100}
      - EMAIL_MONTHLY_SOFT_LIMIT=${EMAIL_MONTHLY_SOFT_LIMIT:-2500}
      - EMAIL_MONTHLY_HARD_LIMIT=${EMAIL_MONTHLY_HARD_LIMIT:-3000}
      - EMAIL_BACKUP_PROVIDER_ENABLED=${EMAIL_BACKUP_PROVIDER_ENABLED:-false}
      - EMAIL_BACKUP_PROVIDER=${EMAIL_BACKUP_PROVIDER:-mailgun}
      - EMAIL_QUOTA_MODE=${EMAIL_QUOTA_MODE:-queue_only}
      - EMAIL_BACKLOG_HIGH_WATERMARK=${EMAIL_BACKLOG_HIGH_WATERMARK:-100}
      - CUSTOMER_OTP_TTL_MINUTES=${CUSTOMER_OTP_TTL_MINUTES:-10}
      - CUSTOMER_OTP_MAX_ATTEMPTS=${CUSTOMER_OTP_MAX_ATTEMPTS:-3}
      - CUSTOMER_OTP_REQUEST_LIMIT=${CUSTOMER_OTP_REQUEST_LIMIT:-5}
      - CUSTOMER_ACTION_SESSION_TTL_MINUTES=${CUSTOMER_ACTION_SESSION_TTL_MINUTES:-15}
      - BOOKING_REMINDER_2H_ENABLED=${BOOKING_REMINDER_2H_ENABLED:-false}
      - BOOKING_REMINDER_MAX_ATTEMPTS=${BOOKING_REMINDER_MAX_ATTEMPTS:-3}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    restart: unless-stopped

  # ============================================================================
  # 4. NUXT 3 SSR FRONTEND SERVICE
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: beauty_nuxt_frontend:latest
    container_name: beauty_nuxt_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000

      # Frontend gets only public API URL / public keys.
      # Never expose Daraja secrets through NUXT_PUBLIC_*.
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      - NUXT_PUBLIC_TURNSTILE_SITE_KEY=${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-1x0000000000000000000000000000000AA}
      - NUXT_TURNSTILE_SECRET_KEY=${NUXT_TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    depends_on:
      - web
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    restart: unless-stopped

  # ============================================================================
  # 4B. FRONTEND TEST SERVICE
  # ============================================================================
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    image: beauty_nuxt_frontend_test:latest
    container_name: beauty_nuxt_frontend_test
    command: tail -f /dev/null
    environment:
      - NODE_ENV=test
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    profiles:
      - test

  # ============================================================================
  # 5. CELERY WORKER SERVICE
  # ============================================================================
  worker:
    image: beauty_web_app:latest
    container_name: beauty_celery_worker
    command: celery -A core worker --loglevel=info -Q celery,express_auth,billing,dlq_billing
    volumes:
      - .:/app:rw
      - receipt_artifacts:/app/var/receipt-artifacts:rw
      - pytest_cache:/app/var/pytest-cache:rw
    environment:
      # ------------------------------------------------------------------------
      # Runtime
      # ------------------------------------------------------------------------
      - DEBUG=${DEBUG:-False}
      - POETRY_VIRTUALENVS_CREATE=false
      - PATH=/app/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      - SECRET_KEY=${SECRET_KEY:-phase1-phase2-prod-verification-key-8f4a2c9e7b6d5a3c1f0e9d8b7a6c5e4f}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DISABLE_DJANGO_ADMIN=${DISABLE_DJANGO_ADMIN:-False}
      - DRF_DISABLE_BROWSABLE_API=${DRF_DISABLE_BROWSABLE_API:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PII_HASH_PEPPER=${PII_HASH_PEPPER:-local-test-pii-hash-pepper-change-me}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-local-test-pii-encryption-key-change-me}

      # ------------------------------------------------------------------------
      # Database
      # ------------------------------------------------------------------------
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432

      # ------------------------------------------------------------------------
      # Redis / Celery
      # ------------------------------------------------------------------------
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0

      # ------------------------------------------------------------------------
      # Browser / proxy safety
      # ------------------------------------------------------------------------
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://frontend:3000,http://localhost:3000,http://127.0.0.1:3000}

      # ------------------------------------------------------------------------
      # Default payment provider safety
      # ------------------------------------------------------------------------
      - CHECKOUT_MPESA_PROVIDER=fake
      - PAYMENT_PROVIDER_MODE=fake

      # ------------------------------------------------------------------------
      # Daraja sandbox / external payment verification
      # ------------------------------------------------------------------------
      - DARAJA_ENV=${DARAJA_ENV:-}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY:-}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET:-}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE:-}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY:-}
      - DARAJA_CALLBACK_URL=${DARAJA_CALLBACK_URL:-}
      - DARAJA_ACCOUNT_REFERENCE=${DARAJA_ACCOUNT_REFERENCE:-}
      - DARAJA_TRANSACTION_DESC=${DARAJA_TRANSACTION_DESC:-}
      - DARAJA_TEST_MSISDN=${DARAJA_TEST_MSISDN:-}
      - DARAJA_TEST_AMOUNT=${DARAJA_TEST_AMOUNT:-1}

      # ------------------------------------------------------------------------
      # Real callback verification controls
      # These must also be available to worker if callback processing/retry uses Celery.
      # ------------------------------------------------------------------------
      - DARAJA_REQUIRE_CALLBACK=${DARAJA_REQUIRE_CALLBACK:-false}
      - DARAJA_CALLBACK_WAIT_SECONDS=${DARAJA_CALLBACK_WAIT_SECONDS:-0}
      - DARAJA_CALLBACK_POLL_INTERVAL_SECONDS=${DARAJA_CALLBACK_POLL_INTERVAL_SECONDS:-5}
      - DARAJA_SANDBOX_ALLOW_TUNNEL_CALLBACKS=${DARAJA_SANDBOX_ALLOW_TUNNEL_CALLBACKS:-false}
      - DARAJA_SANDBOX_CALLBACK_TUNNEL_DOMAINS=${DARAJA_SANDBOX_CALLBACK_TUNNEL_DOMAINS:-}

      # ------------------------------------------------------------------------
      # Daraja network/client config
      # ------------------------------------------------------------------------
      - DARAJA_BASE_URL=${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}
      - DARAJA_CONNECT_TIMEOUT_SECONDS=${DARAJA_CONNECT_TIMEOUT_SECONDS:-2}
      - DARAJA_READ_TIMEOUT_SECONDS=${DARAJA_READ_TIMEOUT_SECONDS:-5}
      - DARAJA_TOKEN_CACHE_TTL_SECONDS=${DARAJA_TOKEN_CACHE_TTL_SECONDS:-3300}
      - DARAJA_ALLOWED_SANDBOX_IPS=${DARAJA_ALLOWED_SANDBOX_IPS:-}

      # ------------------------------------------------------------------------
      # Transactional email / receipt delivery
      # ------------------------------------------------------------------------
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-fake}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-Beauty SaaS <no-reply@example.test>}
      - EMAIL_REPLY_TO_ADDRESS=${EMAIL_REPLY_TO_ADDRESS:-support@example.test}
      - EMAIL_PROVIDER_API_KEY=${EMAIL_PROVIDER_API_KEY:-}
      - EMAIL_PROVIDER_BASE_URL=${EMAIL_PROVIDER_BASE_URL:-}
      - EMAIL_SEND_TIMEOUT_SECONDS=${EMAIL_SEND_TIMEOUT_SECONDS:-5}
      - EMAIL_EXTERNAL_TEST_RECIPIENT=${EMAIL_EXTERNAL_TEST_RECIPIENT:-}
      - RUN_EXTERNAL_EMAIL_TESTS=${RUN_EXTERNAL_EMAIL_TESTS:-false}
      - RECEIPT_PDF_TIMEOUT_SECONDS=${RECEIPT_PDF_TIMEOUT_SECONDS:-5}
      - RECEIPT_PDF_MAX_BYTES=${RECEIPT_PDF_MAX_BYTES:-250000}
      - RECEIPT_PDF_ARTIFACT_DIR=${RECEIPT_PDF_ARTIFACT_DIR:-/app/var/receipt-artifacts}
      - PYTEST_CACHE_DIR=${PYTEST_CACHE_DIR:-/app/var/pytest-cache}
      - EMAIL_NOTIFICATION_MAX_ATTEMPTS=${EMAIL_NOTIFICATION_MAX_ATTEMPTS:-3}
      - EMAIL_DAILY_SOFT_LIMIT=${EMAIL_DAILY_SOFT_LIMIT:-80}
      - EMAIL_DAILY_HARD_LIMIT=${EMAIL_DAILY_HARD_LIMIT:-100}
      - EMAIL_MONTHLY_SOFT_LIMIT=${EMAIL_MONTHLY_SOFT_LIMIT:-2500}
      - EMAIL_MONTHLY_HARD_LIMIT=${EMAIL_MONTHLY_HARD_LIMIT:-3000}
      - EMAIL_BACKUP_PROVIDER_ENABLED=${EMAIL_BACKUP_PROVIDER_ENABLED:-false}
      - EMAIL_BACKUP_PROVIDER=${EMAIL_BACKUP_PROVIDER:-mailgun}
      - EMAIL_QUOTA_MODE=${EMAIL_QUOTA_MODE:-queue_only}
      - EMAIL_BACKLOG_HIGH_WATERMARK=${EMAIL_BACKLOG_HIGH_WATERMARK:-100}
      - CUSTOMER_OTP_TTL_MINUTES=${CUSTOMER_OTP_TTL_MINUTES:-10}
      - CUSTOMER_OTP_MAX_ATTEMPTS=${CUSTOMER_OTP_MAX_ATTEMPTS:-3}
      - CUSTOMER_OTP_REQUEST_LIMIT=${CUSTOMER_OTP_REQUEST_LIMIT:-5}
      - CUSTOMER_ACTION_SESSION_TTL_MINUTES=${CUSTOMER_ACTION_SESSION_TTL_MINUTES:-15}
      - BOOKING_REMINDER_2H_ENABLED=${BOOKING_REMINDER_2H_ENABLED:-false}
      - BOOKING_REMINDER_MAX_ATTEMPTS=${BOOKING_REMINDER_MAX_ATTEMPTS:-3}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beauty_isolated_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A core inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    restart: unless-stopped

  notification-worker:
    image: beauty_web_app:latest
    container_name: beauty_receipt_notification_worker
    command: celery -A core worker --loglevel=info -Q receipts --concurrency=${RECEIPT_WORKER_CONCURRENCY:-2}
    volumes:
      - .:/app:rw
      - receipt_artifacts:/app/var/receipt-artifacts:rw
      - pytest_cache:/app/var/pytest-cache:rw
    environment:
      - DEBUG=${DEBUG:-False}
      - POETRY_VIRTUALENVS_CREATE=false
      - PATH=/app/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      - SECRET_KEY=${SECRET_KEY:-phase1-phase2-prod-verification-key-8f4a2c9e7b6d5a3c1f0e9d8b7a6c5e4f}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PII_HASH_PEPPER=${PII_HASH_PEPPER:-local-test-pii-hash-pepper-change-me}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:-local-test-pii-encryption-key-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-beauty_db}
      - POSTGRES_USER=${POSTGRES_USER:-beauty_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beauty_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-beauty_redis_secure_password}@redis:6379/0
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-fake}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-Beauty SaaS <no-reply@example.test>}
      - EMAIL_REPLY_TO_ADDRESS=${EMAIL_REPLY_TO_ADDRESS:-support@example.test}
      - EMAIL_PROVIDER_API_KEY=${EMAIL_PROVIDER_API_KEY:-}
      - EMAIL_PROVIDER_BASE_URL=${EMAIL_PROVIDER_BASE_URL:-}
      - EMAIL_SEND_TIMEOUT_SECONDS=${EMAIL_SEND_TIMEOUT_SECONDS:-5}
      - EMAIL_EXTERNAL_TEST_RECIPIENT=${EMAIL_EXTERNAL_TEST_RECIPIENT:-}
      - RUN_EXTERNAL_EMAIL_TESTS=${RUN_EXTERNAL_EMAIL_TESTS:-false}
      - RECEIPT_PDF_TIMEOUT_SECONDS=${RECEIPT_PDF_TIMEOUT_SECONDS:-5}
      - RECEIPT_PDF_MAX_BYTES=${RECEIPT_PDF_MAX_BYTES:-250000}
      - RECEIPT_PDF_ARTIFACT_DIR=${RECEIPT_PDF_ARTIFACT_DIR:-/app/var/receipt-artifacts}
      - PYTEST_CACHE_DIR=${PYTEST_CACHE_DIR:-/app/var/pytest-cache}
      - EMAIL_NOTIFICATION_MAX_ATTEMPTS=${EMAIL_NOTIFICATION_MAX_ATTEMPTS:-3}
      - EMAIL_DAILY_SOFT_LIMIT=${EMAIL_DAILY_SOFT_LIMIT:-80}
      - EMAIL_DAILY_HARD_LIMIT=${EMAIL_DAILY_HARD_LIMIT:-100}
      - EMAIL_MONTHLY_SOFT_LIMIT=${EMAIL_MONTHLY_SOFT_LIMIT:-2500}
      - EMAIL_MONTHLY_HARD_LIMIT=${EMAIL_MONTHLY_HARD_LIMIT:-3000}
      - EMAIL_BACKUP_PROVIDER_ENABLED=${EMAIL_BACKUP_PROVIDER_ENABLED:-false}
      - EMAIL_BACKUP_PROVIDER=${EMAIL_BACKUP_PROVIDER:-mailgun}
      - EMAIL_QUOTA_MODE=${EMAIL_QUOTA_MODE:-queue_only}
      - EMAIL_BACKLOG_HIGH_WATERMARK=${EMAIL_BACKLOG_HIGH_WATERMARK:-100}
      - CUSTOMER_OTP_TTL_MINUTES=${CUSTOMER_OTP_TTL_MINUTES:-10}
      - CUSTOMER_OTP_MAX_ATTEMPTS=${CUSTOMER_OTP_MAX_ATTEMPTS:-3}
      - CUSTOMER_OTP_REQUEST_LIMIT=${CUSTOMER_OTP_REQUEST_LIMIT:-5}
      - CUSTOMER_ACTION_SESSION_TTL_MINUTES=${CUSTOMER_ACTION_SESSION_TTL_MINUTES:-15}
      - BOOKING_REMINDER_2H_ENABLED=${BOOKING_REMINDER_2H_ENABLED:-false}
      - BOOKING_REMINDER_MAX_ATTEMPTS=${BOOKING_REMINDER_MAX_ATTEMPTS:-3}
