name: CI Self-Heal (advisory)

# EXPERIMENTAL, money-path-safe self-heal lane — the human-gated analog of
# Cloudflare's HealingAgent. It is a SEPARATE workflow so it can never be part
# of promotion-gate / fortress-gate and can never block a merge. It only ever
# proposes a fix on a `ci-fix/<sha>` branch + PR; a human reviews and merges.
# See docs/ops/CI_WORKFLOW_DESIGN.md §5.

on:
  workflow_dispatch:
    inputs:
      failed_sha:
        description: "Commit SHA that failed CI (defaults to the dispatch ref)"
        required: false
        default: ""
      failed_run_id:
        description: "Failed CI run id to pull logs from (optional)"
        required: false
        default: ""
  # Auto-heal on a failed promotion run is OPT-IN: it only acts when the repo
  # variable CI_HEAL_AUTO == 'true'. Otherwise this path is a no-op.
  workflow_run:
    workflows: ["Secure Enterprise CI Pipeline"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-heal-${{ github.event.workflow_run.head_sha || github.event.inputs.failed_sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci-heal:
    name: ci-heal (experimental, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual dispatch always runs. Auto path runs only on a genuine promotion
    # FAILURE (never schedule/fortress) AND only when explicitly enabled.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event != 'schedule' &&
       vars.CI_HEAL_AUTO == 'true')
    permissions:
      contents: write        # create/push the ci-fix/<sha> branch only
      pull-requests: write   # open the advisory PR
      actions: read          # read failed run logs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.failed_sha != '' && github.event.inputs.failed_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Download failed run logs (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.inputs.failed_run_id != '' && github.event.inputs.failed_run_id || github.event.workflow_run.id }}
        run: |
          if [ -n "${RUN_ID:-}" ]; then
            gh run view "${RUN_ID}" --log-failed > /tmp/ci-failed.log 2>/dev/null || true
          fi

      - name: Propose advisory fix (never auto-merges)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAL_SHA: ${{ github.event.inputs.failed_sha != '' && github.event.inputs.failed_sha || github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/ci/ci_heal.sh
