name: Secure Enterprise CI Pipeline

# CICD-SEC-5: fail-closed default. Jobs elevate packages:write only where needed
# (build-images / docker-build / ci-images-cleanup → GHCR). Everyday jobs get
# read-only packages so they can PULL the build-once CI images from GHCR.
permissions:
  contents: read
  packages: read

# Split lanes so a promo push cannot cancel a fortress/schedule run (and vice versa).
concurrency:
  group: >-
    ${{
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true'))
      && format('ci-fortress-{0}', github.ref)
      || format('ci-promo-{0}', github.ref)
    }}
  cancel-in-progress: true

on:
  push:
    branches:
      - development
  pull_request:
    # development is the integration trunk: PRs into it run the promotion lane so
    # promotion-gate can be a required check (with admin bypass) — see
    # docs/ops/BRANCH_PROTECTION.md. staging/main gate promotion up the ladder.
    branches:
      - development
      - staging
      - main
  # Full fortress (load / ZAP / chaos / latency) — not on every PR (cost + runtime).
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      run_full_fortress:
        description: "Run full fortress (load/ZAP/chaos/latency/cass-cert)"
        required: false
        default: "false"
      run_daraja_sandbox:
        description: "Run opt-in Daraja sandbox contract tests"
        required: false
        default: "false"

env:
  POSTGRES_DB: aesthetic_os_ci
  POSTGRES_USER: aesthetic_os_ci
  POSTGRES_PASSWORD: aesthetic_os_ci_password
  REDIS_PASSWORD: aesthetic_os_ci_redis_password
  SECRET_KEY: django-insecure-ci-placeholder-key-32-chars
  DEBUG: "False"
  PUBLIC_BOOKING_ENABLED: "true"
  NUXT_PUBLIC_BOOKING_ENABLED: "true"
  SECURE_SSL_REDIRECT: "False"
  CHECKOUT_MPESA_PROVIDER: fake
  PAYMENT_PROVIDER_MODE: fake
  EMAIL_PROVIDER: fake
  RECEIPT_PDF_ARTIFACT_DIR: /app/var/receipt-artifacts
  PYTEST_CACHE_DIR: /app/var/pytest-cache
  RECEIPT_PDF_TIMEOUT_SECONDS: "5"
  RECEIPT_PDF_MAX_BYTES: "250000"
  EMAIL_NOTIFICATION_MAX_ATTEMPTS: "3"
  EMAIL_DAILY_SOFT_LIMIT: "80"
  EMAIL_DAILY_HARD_LIMIT: "100"
  EMAIL_QUOTA_MODE: queue_only
  EMAIL_BACKUP_PROVIDER_ENABLED: "false"
  EMAIL_BACKLOG_HIGH_WATERMARK: "100"
  DARAJA_ENV: sandbox
  DARAJA_CONSUMER_KEY: ""
  DARAJA_CONSUMER_SECRET: ""
  DARAJA_SHORTCODE: ""
  DARAJA_PASSKEY: ""
  DARAJA_CALLBACK_URL: ""
  DARAJA_ACCOUNT_REFERENCE: ""
  DARAJA_TRANSACTION_DESC: ""
  DARAJA_TEST_MSISDN: ""

# GitHub-hosted Linux runners (ubuntu-latest).
# Self-hosted fallback: docs/ops/SELF_HOSTED_RUNNER.md.
defaults:
  run:
    shell: bash

# =============================================================================
# Two lanes (promotion vs fortress) + Daraja opt-in:
#
# PROMOTION (push / PR / also on schedule) — merge confidence:
#   P0 validate → lint-security
#   P0.5 build-images (build web/frontend/frontend-test ONCE → GHCR :ci-<sha>)
#   P1 django-smoke                (pulls prebuilt images)
#   P2 domain units + frontend-test (FE lint/unit/type/build)
#   P3 payment-security (BE abuse/authz — does NOT need frontend-test)
#   P4 checkout-billing-integration → receipt-pipeline
#   P5 newman-acceptance + frontend-e2e
#   P6 docker-build (+ GHCR digest)
#   promotion-gate aggregator (required branch-protection check)
#
# BUILD-ONCE REUSE (Cloudflare "install once, cache, reuse"):
#   build-images builds the three CI images a single time and pushes run-scoped
#   GHCR tags. Every downstream job PULLS + retags to the compose ':latest' and
#   runs `docker compose up -d` WITHOUT --build. See docs/ops/CI_WORKFLOW_DESIGN.md
#   and scripts/ci/{build_ci_images,pull_ci_images,cleanup_ci_images}.sh.
#
# FORTRESS (schedule weeknights 02:00 UTC, or run_full_fortress=true):
#   Surfaces (coverage ≠ DAG wire position):
#     platform-latency  → gallery/staff/calendar/booking/receipt/Kenya p95
#     payment-load      → fake-provider payment storms
#     notification-backlog → email backlog pressure
#     zap-passive-surface → OpenAPI + Newman + FE edge public paths
#     chaos             → Toxiproxy DB/Redis (fake provider only)
#     cass-certification → CASS sign-off bundle
#     fortress-gate     → aggregator; release freshness marker
#   On a green schedule the ONLY intentional skip is daraja-sandbox-contract.
#   Grey fortress after a red promo job is a GitHub needs-cascade, not a
#   disabled schedule.
#
# DARAJA (opt-in only): workflow_dispatch + run_daraja_sandbox=true
# =============================================================================

jobs:
  # --- T0 -------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Validate Poetry files
        run: poetry check --lock

  lint-security:
    name: lint-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install project dev dependencies
        run: bash scripts/ci/with_retry.sh 3 10 -- poetry install --with dev --no-root

      - name: Dependency vulnerability audit (CICD-SEC-3)
        run: |
          bash scripts/ci/with_retry.sh 3 10 -- pip install pip-audit
          bash scripts/ci/with_retry.sh 3 10 -- poetry self add poetry-plugin-export
          poetry export --without-hashes --with dev -o /tmp/requirements-audit.txt
          # Do not wrap pip-audit in with_retry: findings are deterministic, not flakes.
          pip-audit -r /tmp/requirements-audit.txt --desc

      - name: Run Poetry lint and security gates
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run ruff check .
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry run bandit -r . -x tests,.venv,.cache,frontend/node_modules -ll -ii
          poetry run python scripts/ci/secret_hygiene.py

  # --- P0.5 build once, reuse everywhere ------------------------------------
  # Cloudflare "install once, cache, reuse": build the three CI images a single
  # time and push run-scoped GHCR tags. Every downstream job pulls instead of
  # running `docker compose up --build`, turning ~13 cold builds into one.
  build-images:
    name: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-security
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push CI images once (web + frontend + frontend-test)
        run: bash scripts/ci/build_ci_images.sh
      - name: Record build-images wall-time
        if: always()
        run: bash scripts/ci/emit_job_timing.sh build-images

  # --- T1 -------------------------------------------------------------------
  django-smoke:
    name: django-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint-security
      - build-images
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend

      - name: Start Docker services
        run: docker compose up -d

      - name: Wait for Docker health
        run: |
          for i in {1..30}; do
            WEB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' aesthetic_os_web_app 2>/dev/null || echo starting)
            DB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' aesthetic_os_postgres_db 2>/dev/null || echo starting)
            REDIS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' aesthetic_os_redis 2>/dev/null || echo starting)
            if [ "$WEB_STATUS" = healthy ] && [ "$DB_STATUS" = healthy ] && [ "$REDIS_STATUS" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Django checks and migrate smoke
        run: |
          docker compose exec -T web poetry run python manage.py makemigrations --check --dry-run
          docker compose exec -T web poetry run python manage.py check
          bash scripts/ci/bootstrap_web_db.sh

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail=300 web worker db redis frontend || true

      - name: Stop Docker services
        if: always()
        run: bash scripts/ci/compose_reset.sh

  # --- T2 parallel ----------------------------------------------------------
  bookings-unit:
    name: bookings-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-smoke
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Wait for Docker health
        run: bash scripts/ci/wait_for_compose_health.sh
      - name: Run bookings domain partition
        run: bash scripts/ci/run_pytest_partition.sh bookings.xml bookings/tests
      - name: Upload bookings gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookings-unit-reports
          path: reports/ci/
          if-no-files-found: warn
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  billing-unit:
    name: billing-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - run: docker compose exec -T web poetry run pytest billing/tests
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  checkout-unit:
    name: checkout-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - run: docker compose exec -T web poetry run pytest checkout/tests
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  tests-api-unit:
    name: tests-api-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-smoke
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Wait for Docker health
        run: bash scripts/ci/wait_for_compose_health.sh
      - name: Run API and unit partitions
        run: bash scripts/ci/run_pytest_partition.sh api-unit.xml tests/api tests/unit
      - name: Upload API unit gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-api-unit-reports
          path: reports/ci/
          if-no-files-found: warn
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  cass-calendar-service:
    name: cass-calendar-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-smoke
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Wait for Docker health
        run: bash scripts/ci/wait_for_compose_health.sh
      - name: Run CASS calendar service gates
        run: >
          bash scripts/ci/run_pytest_partition.sh cass-calendar.xml
          tests/api/test_marketing_catalog_contract.py
          tests/security/test_cass_policy_option_a.py
          tests/security/test_calendar_cache_red_team.py
          tests/security/test_calendar_policy_red_team.py
          tests/security/test_calendar_service_failure_red_team.py
          tests/security/test_booking_calendar_red_team.py
          bookings/tests/test_calendar_policy.py
          bookings/tests/test_service_day_rules.py
          bookings/tests/test_booking_calendar_api.py
          tests/latency/test_calendar_service_latency.py
      - name: Upload CASS calendar gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cass-calendar-service-reports
          path: reports/ci/
          if-no-files-found: warn
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: |
          bash scripts/ci/compose_reset.sh
          docker compose --profile test down --volumes --remove-orphans || true
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh frontend-test
      - run: docker compose --profile test up -d frontend-test
      - name: npm dependency vulnerability audit (CICD-SEC-3)
        run: docker compose exec -T frontend-test npm audit --audit-level=high
      - run: docker compose exec -T frontend-test npm run lint:oxlint
      - run: docker compose exec -T frontend-test npm run test
      - run: docker compose exec -T frontend-test npm run type-check
      - run: docker compose exec -T frontend-test npm run build
      - if: failure()
        run: docker compose logs --tail=300 frontend-test || true
      - if: always()
        run: |
          docker compose --profile test down --volumes --remove-orphans || true
          bash scripts/ci/compose_reset.sh

  # --- P3 money-path security (before heavy integration / load) -------------
  # Backend-only needs: a red frontend-test must not cascade-skip fortress soak.
  payment-security:
    name: payment-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - django-smoke
      - bookings-unit
      - billing-unit
      - checkout-unit
      - tests-api-unit
      - cass-calendar-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - run: docker compose exec -T web poetry run pytest tests/security
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  # --- T4 business lifecycle ------------------------------------------------
  checkout-billing-integration:
    name: checkout-billing-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - billing-unit
      - checkout-unit
      - payment-security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - run: docker compose exec -T web poetry run pytest tests/integration
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  receipt-pipeline:
    name: receipt-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checkout-billing-integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Run deterministic booking/billing/receipt pipeline
        run: |
          docker compose exec -T web poetry run pytest \
            tests/integration/test_booking_receipt_email_contract.py \
            tests/integration/test_booking_checkout_billing_receipt_pipeline.py \
            bookings/tests/test_notification_delivery_ci_parity.py \
            bookings/tests/test_receipt_artifact_ci_storage.py \
            bookings/tests/test_fake_provider_pdf_attachment_contract.py \
            bookings/tests/test_booking_status_endpoint.py \
            bookings/tests/test_booking_status_endpoint_security.py \
            bookings/tests/test_email_quota_fallback.py \
            -vv
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  # --- T5 contract + OWASP ZAP passive --------------------------------------
  newman-acceptance:
    name: newman-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - cass-calendar-service
      - bookings-unit
      - payment-security
      - frontend-test
      - receipt-pipeline
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Wait for Docker health
        run: bash scripts/ci/wait_for_compose_health.sh
      - name: Migrate live web DB before Newman seeds
        run: bash scripts/ci/bootstrap_web_db.sh
      - name: Run Newman acceptance (folder 06 Calendar and Handoff)
        run: bash scripts/ci/run_newman_docker.sh
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-acceptance-reports
          path: reports/ci/newman/
          if-no-files-found: warn
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  # Job key kept for needs: stability; display name shows app-wide surface.
  zap-passive-newman:
    name: zap-passive-surface
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    needs: newman-acceptance
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - name: Start API + frontend edge for passive surface scan
        run: docker compose up -d db redis web worker frontend frontend-edge
      - name: Wait for API + frontend edge
        run: |
          for i in $(seq 1 90); do
            api_ok=0
            fe_ok=0
            if curl -fsS "http://127.0.0.1:8000/api/health-check/" >/dev/null; then api_ok=1; fi
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null; then fe_ok=1; fi
            if [[ "${api_ok}" -eq 1 && "${fe_ok}" -eq 1 ]]; then
              echo "api + frontend edge ready for ZAP"
              exit 0
            fi
            sleep 3
          done
          echo "ZAP stack not ready"
          docker compose logs --tail=200 db redis web frontend frontend-edge || true
          exit 1
      - name: Migrate and seed live web DB for Newman-through-ZAP
        run: |
          bash scripts/ci/bootstrap_web_db.sh
          docker compose exec -T web poetry run python manage.py seed_api_acceptance_data
          docker compose exec -T web poetry run python manage.py seed_marketing_catalog
      - name: Run ZAP passive surface gate (API + Newman + FE public paths)
        run: pwsh -NoProfile -File scripts/ci/run_security_passive_gate.ps1 -Mode all-passive
      - name: Upload ZAP passive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-passive-surface-reports
          path: reports/security/zap/
          if-no-files-found: warn
      - if: failure()
        run: docker compose logs --tail=300 db redis web worker frontend frontend-edge || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  # --- T6 perf / load (after money-path security) ---------------------------
  payment-load-resilience:
    name: payment-load-resilience
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    needs:
      - payment-security
      - receipt-pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Run bounded fake-provider payment load tests
        run: |
          docker compose exec -T web poetry run pytest tests/load \
            -m "payment_load" \
            --ignore=tests/load/test_notification_backlog_pressure.py \
            -vv --durations=25
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  notification-backlog-load:
    name: notification-backlog-load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    needs:
      - payment-security
      - receipt-pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Run isolated 1000-notification backlog proof
        run: docker compose exec -T web poetry run pytest tests/load/test_notification_backlog_pressure.py -vv --durations=25
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  # Job key `latency` kept for needs: stability; covers gallery/staff/calendar/etc.
  latency:
    name: platform-latency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    needs:
      - payment-security
      - receipt-pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - run: docker compose up -d
      - name: Run platform latency budgets (gallery/staff/calendar/booking/receipt)
        run: docker compose exec -T web poetry run pytest tests/latency -m "latency" -vv
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  # --- T7 chaos (not blocked by notification-backlog sibling) -----------------
  chaos:
    name: chaos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    needs:
      - payment-load-resilience
      - latency
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: |
          bash scripts/ci/compose_reset.sh
          docker compose -f docker-compose.yml -f docker-compose.toxiproxy.yml down --volumes --remove-orphans || true
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI web image (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web
      - name: Run Toxiproxy chaos gate (fake provider only)
        run: bash scripts/ci/run_chaos_toxiproxy.sh
      - if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.toxiproxy.yml logs --tail=300 web worker db redis toxiproxy || true
      - if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.toxiproxy.yml down --volumes --remove-orphans || true
          bash scripts/ci/compose_reset.sh

  # --- T8 certify + image ---------------------------------------------------
  cass-certification:
    name: cass-certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    needs:
      - bookings-unit
      - cass-calendar-service
      - newman-acceptance
      - zap-passive-newman
      - latency
      - payment-security
      - frontend-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Emit CASS certification report
        run: |
          mkdir -p reports/ci
          python scripts/ci/generate_gate_report.py cass-certification passed \
            "bookings-unit partition green" \
            "cass-calendar-service gates green" \
            "newman acceptance green" \
            "platform-latency partition includes calendar/gallery/staff p95 gates" \
            "zap-passive-surface (API+Newman+FE) green" \
            "payment-security partition includes calendar red-team" \
            "frontend-backend-trust and privacy-redaction gates green" \
            "frontend-test lint/type/build green"
      - name: Upload CASS certification report
        uses: actions/upload-artifact@v4
        with:
          name: cass-certification-report
          path: reports/ci/cass-certification.md

  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - frontend-test
      - django-smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI images (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web frontend
      - name: Start API + frontend edge stack
        # Book/availability e2e needs Django+Redis; browser uses same-origin /api via frontend-edge.
        run: docker compose up -d db redis web frontend frontend-edge
      - name: Wait for API readiness + frontend edge
        run: |
          for i in $(seq 1 90); do
            api_ok=0
            fe_ok=0
            if curl -fsS "http://127.0.0.1:8000/api/health-check/" >/dev/null; then
              api_ok=1
            fi
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null; then
              fe_ok=1
            fi
            if [[ "${api_ok}" -eq 1 && "${fe_ok}" -eq 1 ]]; then
              echo "api + frontend edge ready"
              docker compose exec -T web poetry run python manage.py migrate --noinput
              exit 0
            fi
            sleep 3
          done
          echo "stack did not become ready"
          docker compose logs --tail=200 db redis web frontend frontend-edge || true
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps + Playwright chromium
        working-directory: frontend
        run: |
          # packageManager pin (npm@10.9.8) — keep lockfile strict on the same major as local/CI.
          corepack enable
          corepack prepare npm@10.9.8 --activate
          bash ../scripts/ci/with_retry.sh 3 10 -- npm ci
          bash ../scripts/ci/with_retry.sh 3 15 -- npx playwright install --with-deps chromium
      - name: Run Playwright e2e (chromium)
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npx playwright test --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-playwright
          path: frontend/playwright-report/
          if-no-files-found: warn
      - name: Record frontend-e2e wall-time
        if: always()
        run: bash scripts/ci/emit_job_timing.sh frontend-e2e
      - if: failure()
        run: docker compose logs --tail=300 db redis web frontend frontend-edge || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Promotion lane: do not wait on fortress-only jobs (skipped on PR/push).
    needs:
      - newman-acceptance
      - frontend-test
      - frontend-e2e
      - receipt-pipeline
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build production image
        run: docker build -t aesthetic-os-prod:latest .
      - name: Validate compose config
        run: docker compose config -q
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image digest to GHCR
        id: push
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${REPO}/aesthetic-os-prod"
          TAG="${{ github.sha }}"
          docker tag aesthetic-os-prod:latest "${IMAGE}:${TAG}"
          docker tag aesthetic-os-prod:latest "${IMAGE}:sha-${TAG}"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:sha-${TAG}"
          DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}" 2>/dev/null || true)"
          if [[ -z "${DIGEST}" || "${DIGEST}" == "<no value>" ]]; then
            DIGEST="${IMAGE}:${TAG}"
            echo "::warning::RepoDigests empty after push; recording tag ${DIGEST}"
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "tag=${IMAGE}:${TAG}" >> "${GITHUB_OUTPUT}"
          mkdir -p reports/ci
          {
            echo "image_tag=${IMAGE}:${TAG}"
            echo "image_digest=${DIGEST}"
            echo "git_sha=${TAG}"
          } > reports/ci/image-digest.txt
          echo "Published ${DIGEST}"
      - name: Upload image digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: reports/ci/image-digest.txt
          if-no-files-found: error

  promotion-gate:
    name: promotion-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - validate
      - lint-security
      - build-images
      - django-smoke
      - bookings-unit
      - billing-unit
      - checkout-unit
      - tests-api-unit
      - cass-calendar-service
      - frontend-test
      - payment-security
      - checkout-billing-integration
      - receipt-pipeline
      - newman-acceptance
      - frontend-e2e
      - docker-build
    steps:
      - name: Assert all promotion jobs succeeded
        env:
          RESULTS: >-
            validate=${{ needs.validate.result }}
            lint-security=${{ needs.lint-security.result }}
            build-images=${{ needs.build-images.result }}
            django-smoke=${{ needs.django-smoke.result }}
            bookings-unit=${{ needs.bookings-unit.result }}
            billing-unit=${{ needs.billing-unit.result }}
            checkout-unit=${{ needs.checkout-unit.result }}
            tests-api-unit=${{ needs.tests-api-unit.result }}
            cass-calendar-service=${{ needs.cass-calendar-service.result }}
            frontend-test=${{ needs.frontend-test.result }}
            payment-security=${{ needs.payment-security.result }}
            checkout-billing-integration=${{ needs.checkout-billing-integration.result }}
            receipt-pipeline=${{ needs.receipt-pipeline.result }}
            newman-acceptance=${{ needs.newman-acceptance.result }}
            frontend-e2e=${{ needs.frontend-e2e.result }}
            docker-build=${{ needs.docker-build.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in ${RESULTS}; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}: ${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::promotion-gate red — one or more promotion jobs did not succeed"
            exit 1
          fi
          echo "promotion-gate green"

  coverage-map:
    name: coverage-map
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Emit FE/BE/money-path coverage map
        run: |
          mkdir -p reports/ci
          python3 - <<'PY'
          from pathlib import Path
          Path("reports/ci/coverage-map.md").write_text(
          """# Secure Enterprise CI — coverage map

          Chart wires show *when* jobs run. This map shows *what* they exercise.

          | Job | Frontend | Backend | Money-path |
          |-----|----------|---------|------------|
          | build-images | one build of FE image | one build of web image | shared prebuilt images |
          | frontend-test / frontend-e2e | lint/unit/type/build + Playwright | via edge→API | book handoff UI |
          | bookings/billing/checkout/api/cass units | — | domain partitions | calendar/checkout units |
          | payment-security | — | abuse/authz | STK/webhook/throttle/RBAC |
          | newman-acceptance | — | Calendar/Handoff API | booking contracts |
          | platform-latency | — | gallery/staff/legal/calendar | Kenya booking/receipt p95 |
          | payment-load / notification-backlog | — | Celery/email pressure | fake-provider storms |
          | zap-passive-surface | `/` `/services` `/book` passive | OpenAPI + Newman | — |
          | chaos | — | Toxiproxy DB/Redis | fake M-Pesa callback chaos |
          | promotion-gate | merge check | merge check | merge check |
          | fortress-gate | release soak | release soak | release soak |
          | daraja-sandbox-contract | — | — | real Daraja (opt-in only) |

          On green **schedule**, expected skip set = `{daraja-sandbox-contract}` only.
          """.replace("          ", ""),
              encoding="utf-8",
          )
          print("wrote reports/ci/coverage-map.md")
          PY
      - name: Upload coverage map
        uses: actions/upload-artifact@v4
        with:
          name: ci-coverage-map
          path: reports/ci/coverage-map.md
          if-no-files-found: error

  fortress-gate:
    name: fortress-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_full_fortress == 'true'))
    needs:
      - latency
      - payment-load-resilience
      - notification-backlog-load
      - zap-passive-newman
      - chaos
      - cass-certification
    steps:
      - name: Assert fortress jobs succeeded (Daraja may stay skipped)
        env:
          RESULTS: >-
            platform-latency=${{ needs.latency.result }}
            payment-load-resilience=${{ needs.payment-load-resilience.result }}
            notification-backlog-load=${{ needs.notification-backlog-load.result }}
            zap-passive-surface=${{ needs.zap-passive-newman.result }}
            chaos=${{ needs.chaos.result }}
            cass-certification=${{ needs.cass-certification.result }}
        run: |
          set -euo pipefail
          echo "Expected intentional skip on schedule: daraja-sandbox-contract only"
          failed=0
          for pair in ${RESULTS}; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}: ${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::fortress-gate red — one or more fortress jobs did not succeed"
            exit 1
          fi
          echo "fortress-gate green (daraja remains opt-in)"

  # Best-effort cleanup of run-scoped ':ci-<sha>' GHCR tags pushed by
  # build-images. Non-blocking (never a required check); a scheduled retention
  # policy is the reliable backstop (docs/ops/CI_WORKFLOW_DESIGN.md).
  ci-images-cleanup:
    name: ci-images-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - promotion-gate
      - fortress-gate
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Delete run-scoped CI image tags (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/cleanup_ci_images.sh

  # Opt-in only — real Daraja HTTP callback; never on push/schedule.
  daraja-sandbox-contract:
    name: daraja-sandbox-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.run_daraja_sandbox == 'true'
    needs: docker-build
    # CICD-SEC-5: isolates real third-party (Daraja sandbox) secrets behind a
    # dedicated GitHub Environment with required-reviewer human approval gate.
    environment: daraja-sandbox
    permissions:
      contents: read
      packages: read
    env:
      DARAJA_ENV: sandbox
      DARAJA_CONSUMER_KEY: ${{ secrets.DARAJA_CONSUMER_KEY }}
      DARAJA_CONSUMER_SECRET: ${{ secrets.DARAJA_CONSUMER_SECRET }}
      DARAJA_SHORTCODE: ${{ secrets.DARAJA_SHORTCODE }}
      DARAJA_PASSKEY: ${{ secrets.DARAJA_PASSKEY }}
      DARAJA_CALLBACK_URL: ${{ secrets.DARAJA_CALLBACK_URL }}
      DARAJA_ACCOUNT_REFERENCE: ${{ secrets.DARAJA_ACCOUNT_REFERENCE }}
      DARAJA_TRANSACTION_DESC: ${{ secrets.DARAJA_TRANSACTION_DESC }}
      DARAJA_TEST_MSISDN: ${{ secrets.DARAJA_TEST_MSISDN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reset leftover Compose state
        run: bash scripts/ci/compose_reset.sh
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt CI web image (build-once reuse)
        run: bash scripts/ci/pull_ci_images.sh web
      - run: docker compose up -d web worker db redis
      - name: Run opt-in Daraja sandbox contract
        run: docker compose exec -T web poetry run pytest tests/external -m "daraja_sandbox" --run-external -vv
      - if: failure()
        run: docker compose logs --tail=300 web worker db redis || true
      - if: always()
        run: bash scripts/ci/compose_reset.sh
