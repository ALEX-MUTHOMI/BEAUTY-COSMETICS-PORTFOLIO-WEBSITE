[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_tests.py
addopts = --ds=core.settings
markers =
    load: deterministic Docker load and resilience tests
    payment_load: deterministic fake-provider payment load and resilience tests
    payment_security: payment perimeter, redaction, spoofing, and abuse tests
    payment_contract: provider contract and checkout-billing payment contract tests
    latency: deterministic checkout latency and slow-network tests
    network_resilience: backend/provider network degradation tests
    frontend_resilience: frontend checkout timeout, retry, and polling tests
    external: opt-in tests requiring external network/services
    daraja_sandbox: opt-in Safaricom Daraja sandbox contract tests
