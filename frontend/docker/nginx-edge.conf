# Edge proxy: static /images via sendfile, everything else to Nuxt.
# Upstream name must match the Nuxt container DNS on the compose network.
upstream shee_nuxt {
  server frontend:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Hero + public images — avoid Node for concurrent static GETs
  # Deny underscore scratch/candidate trees even if bind-mounted.
  location ~* ^/images/_ {
    return 404;
  }

  location /images/ {
    alias /var/www/images/;
    sendfile on;
    tcp_nopush on;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://shee_nuxt;
  }
}
