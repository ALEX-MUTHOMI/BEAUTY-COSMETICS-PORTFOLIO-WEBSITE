# Edge proxy: static /images via sendfile, /api to Django, everything else to Nuxt.
# Django remains source of truth for auth, CSRF, throttles, and webhooks.
# Upstream names must match compose DNS on the isolated network.
upstream shee_nuxt {
  server frontend:3000;
  keepalive 32;
}

upstream shee_api {
  server web:8000;
  keepalive 16;
}

# Only honor an explicit HTTPS hop (Cloudflare / cloudflared). Never trust
# arbitrary X-Forwarded-Proto values from the client.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Hero + public images — avoid Node for concurrent static GETs
  # Deny underscore scratch/candidate trees even if bind-mounted.
  location ~* ^/images/_ {
    return 404;
  }

  location /images/ {
    alias /var/www/images/;
    sendfile on;
    tcp_nopush on;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  # Django admin is never on this public hostname.
  location ^~ /admin {
    return 404;
  }

  # Scanner bait — never SPA-fallback these as HTTP 200 HTML.
  location ~* ^/(\.env|\.git|wp-admin|wp-login\.php|xmlrpc\.php|graphql)(/|$) {
    return 404;
  }

  # Private media prefix is not a public listing. Opaque handles live under /media/public/.
  location /media/ {
    return 404;
  }

  # Same-origin API so HTTPS (tunnel or one production host) can book without
  # mixed-content or cross-site CSRF against :8000. Do not proxy /admin.
  location /api/ {
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_pass http://shee_api;
  }

  # Opaque public gallery handles only. Do not proxy /media/ (private keys stay on Django).
  location ^~ /media/public/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_pass http://shee_api;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_pass http://shee_nuxt;
  }
}
