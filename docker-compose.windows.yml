# Windows host bind-mount workaround ONLY.
# Host `.venv` (Scripts/) shadows Linux Poetry when `.:/app` is mounted.
# CI must never load this file — runners have no Windows venv and the empty
# named volume breaks `poetry run` with Permission denied on /app/.venv.
#
# Local use (PowerShell):
#   $env:COMPOSE_FILE = "docker-compose.yml;docker-compose.windows.yml"
#   docker compose up -d --force-recreate web worker
# Or add to local .env (not committed):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.windows.yml

volumes:
  linux_venv_mask:
    driver: local

services:
  web:
    volumes:
      - linux_venv_mask:/app/.venv
  worker:
    volumes:
      - linux_venv_mask:/app/.venv
  beat:
    volumes:
      - linux_venv_mask:/app/.venv
  notification-worker:
    volumes:
      - linux_venv_mask:/app/.venv
  gallery-worker:
    volumes:
      - linux_venv_mask:/app/.venv
